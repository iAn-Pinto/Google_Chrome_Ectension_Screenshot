<!DOCTYPE html>
<html>
  <head>
    <title>Screenshot Extension</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <h1>Screenshot Extension</h1>
    <div>
      <label for="format">Format:</label>
      <select id="format">
        <option value="png" selected>PNG</option>
        <option value="jpeg">JPEG</option>
      </select>
    </div>
    <div>
      <label for="quality">Quality (JPEG):</label>
      <input id="quality" type="range" min="0.1" max="1" step="0.1" value="0.9" />
      <span id="qualityVal">0.9</span>
    </div>
    <div>
      <label for="filename">Filename:</label>
      <input id="filename" type="text" value="screenshot" />
    </div>
    <div>
      <label><input type="checkbox" id="autoDownload" checked /> Auto download</label>
    </div>
    <div>
      <label><input type="checkbox" id="addTimestamp" /> Add timestamp to filename</label>
    </div>
    <hr />
    <button id="captureVisible">Capture Visible Part</button>
    <button id="captureSelected">Capture Selected Area</button>
    <button id="captureFull">Capture Full Page</button>
    <script src="popup.js"></script>
  </body>
</html>
