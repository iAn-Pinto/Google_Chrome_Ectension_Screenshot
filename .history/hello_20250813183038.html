<!DOCTYPE html>
<html>
  <head>
    <title>Screenshot Extension</title>
    <link rel="stylesheet" type="text/css" href="style.css">
  </head>
  <body>
    <h1>Screenshot Extension</h1>
    <div>
      <label for="format">Format:</label>
      <select id="format">
        <option value="png" selected>PNG</option>
        <option value="jpeg">JPEG</option>
      </select>
    </div>
    <div>
      <label for="quality">Quality (JPEG):</label>
      <input id="quality" type="range" min="0.1" max="1" step="0.1" value="0.9" />
      <span id="qualityVal">0.9</span>
    </div>
    <div>
      <label for="filename">Filename:</label>
      <input id="filename" type="text" value="screenshot" />
    </div>
    <div>
      <label><input type="checkbox" id="autoDownload" checked /> Auto download</label>
    </div>
    <div>
      <label><input type="checkbox" id="addTimestamp" /> Add timestamp to filename</label>
    </div>
    <div>
      <label for="retryAttempts">Retry Attempts:</label>
      <input id="retryAttempts" type="number" min="0" max="10" value="3" style="width:60px" />
    </div>
    <div>
      <label for="retryDelay">Retry Delay (ms):</label>
      <input id="retryDelay" type="number" min="50" step="50" value="180" style="width:80px" />
    </div>
    <hr />
    <button id="captureVisible">Capture Visible Part</button>
    <button id="captureSelected">Capture Selected Area</button>
    <button id="captureFull">Capture Full Page</button>
    <div id="progressContainer" style="display:none;margin-top:10px;">
      <div style="font-size:12px;margin-bottom:4px;" id="progressLabel">Progress</div>
      <div style="height:8px;background:#eee;border-radius:4px;overflow:hidden;">
        <div id="progressBar" style="height:100%;width:0%;background:#4A90E2;transition:width .2s"></div>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
